<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel ao vivo cozinha</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: painel operacional de cozinha, lido a 4 metros, sem enfeite
   IDEA: trilho de comandas (KDS) — cada pedido é uma comanda que anda da cozinha até o cliente
   PICTURE: o próprio quadro kanban com cronômetros vivos
   COLOUR+TYPE: roxo Dobra (TV) + comanda creme, laranja Dobra como destaque; verde/âmbar/vermelho só para estado; Barlow Condensed nos números
   LAYOUT: barra de indicadores, 4 colunas de etapa, faixa de motoboys embaixo */
:root{color-scheme:dark;--bg:#1b0d20;--panel:#2a1530;--line:#40264a;--ink:#fcf7ef;--mute:#bba5bf;--paper:#fcf7ef;--dark:#3c193f;--dobra-roxo:#fcf7ef;--dobra-ink:#fcf7ef;
--ok:#2fbf71;--warn:#f2a516;--bad:#ef4b4b;--acc:#fe7237}
*{box-sizing:border-box;min-width:0}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif;overflow-x:clip}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:14px max(2vw,14px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;position:relative;padding-inline-start:46px}.brand .logo{position:absolute;left:0;top:50%;transform:translateY(-50%);width:36px;height:33px;color:var(--ink)}.brand .logo svg{width:100%;height:100%}.brand b{font-size:20px}.brand span{color:var(--mute);font-size:13px}
.brand span.off{color:var(--bad);font-weight:600}
.clock{font-size:clamp(40px,4vw,64px);line-height:1;margin-inline-start:auto}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 12px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-bottom:1px solid var(--line)}
.kpi{padding:12px 16px;box-shadow:inset -1px 0 var(--line),inset 0 -1px var(--line)}.kpi small{display:block;color:var(--mute);font-size:13px}.kpi .num{font-size:clamp(30px,3vw,46px);line-height:1.05}
.kpi.bad .num{color:var(--bad)}.kpi.ok .num{color:var(--ok)}.kpi.warn .num{color:var(--warn)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px max(2vw,14px)}
.col{background:var(--panel);border-radius:12px;padding:10px;min-height:52vh;display:flex;flex-direction:column;gap:8px}
.col h2{margin:2px 4px 6px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.col h2 .num{font-size:28px}
.card{background:var(--paper);color:var(--dark);border-radius:8px;padding:8px 10px 10px;border-inline-start:8px solid var(--ok)}
.card.warn{border-color:var(--warn)}.card.bad{border-color:var(--bad)}.card.late{box-shadow:0 0 0 3px var(--bad)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.card .id{font-size:30px;line-height:1}.card .t{font-size:34px;line-height:1}
.card.warn .t{color:#a86a00}.card.bad .t{color:#c62828}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:#5a3d5e;margin-top:4px}
.tag{font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px;background:#f1e4d6;color:#3c193f}
.tag.late{background:var(--bad);color:#fff}.tag.sus{background:#3c193f;color:#fcf7ef}.tag.ok{background:#cdeedb;color:#11643a}
.bar{height:6px;background:#eadccd;border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.card.warn .bar i{background:var(--warn)}.card.bad .bar i,.card.late .bar i{background:var(--bad)}
.card.mbc{border-color:var(--mute)}.card.mbc.ok{border-color:var(--ok)}.card.mbc.vez{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc)}.card.mbc.pausa{opacity:.55}
.card .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;line-height:1.05;overflow-wrap:anywhere}
.empty{color:var(--mute);text-align:center;padding:20px 0;font-size:14px}
.riders{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:0 max(2vw,14px) 14px}
.rider{background:var(--panel);border-radius:10px;padding:10px 12px;border-top:4px solid var(--mute)}
.rider.rota{border-color:var(--ok)}.rider.loja{border-color:var(--warn)}.rider.pausa{border-color:var(--line)}
.rider b{font-size:17px}.rider .st{display:flex;justify-content:space-between;align-items:baseline}.rider .st .num{font-size:30px}
.rider .ld{font-size:16px;margin:2px 0 4px}.rider .ld b{font-family:"Barlow Condensed",sans-serif;font-size:22px}.rider .ld.sai{color:var(--warn)}
.rider .sm{color:var(--mute);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.chk{display:flex;flex-wrap:wrap;gap:8px;padding:0 max(2vw,14px) 12px}.chk .it{background:#3a1d33;border:1px solid #6a3a4a;border-radius:8px;padding:6px 10px;font-size:14px}.chk .it b{font-family:"Barlow Condensed",sans-serif;font-size:20px;margin-inline-end:6px}.chk .it span{color:var(--mute)}
.placar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:4px max(2vw,14px) 12px}.placar div{background:var(--panel);border-radius:10px;padding:10px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:4px solid var(--mute)}.placar div.rota{border-color:var(--ok)}.placar div.loja{border-color:var(--warn)}.placar div.via{border-color:var(--acc)}.placar small{display:block;font-size:13px;color:var(--mute)}.placar span{font-size:16px;color:var(--mute)}.placar b{font-family:"Barlow Condensed",sans-serif;font-size:clamp(40px,4vw,60px);line-height:1}
@media(max-width:900px){.placar{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.placar{grid-template-columns:minmax(0,1fr)}}
.metas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;padding:12px max(2vw,14px) 0}
.alvo{background:var(--panel);border-radius:10px;padding:10px 14px}.alvo .l{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:15px;color:var(--mute)}.alvo .l b{font-family:"Barlow Condensed",sans-serif;font-size:30px;color:var(--ink)}
.alvo .tr{height:12px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}.alvo .tr i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--warn))}.alvo.ok .tr i{background:var(--ok)}
#festa{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(27,13,32,.8)}#festa canvas{position:absolute;inset:0;width:100%;height:100%}
#festa .msg{position:relative;text-align:center;padding:24px 36px;border-radius:18px;background:var(--paper);color:var(--dark);box-shadow:0 20px 60px rgba(0,0,0,.5)}
#festa .msg b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:clamp(44px,7vw,110px);line-height:1;color:var(--acc)}#festa .msg span{display:block;font-size:clamp(20px,2.4vw,34px);margin-top:8px}
@media(prefers-reduced-motion:no-preference){#festa .msg{animation:pulo .9s cubic-bezier(.2,1.6,.4,1)}}@keyframes pulo{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.fila{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;padding:12px max(2vw,14px) 0}
.fila .vez{background:var(--acc);color:#2a0f2e;border-radius:12px;padding:8px 18px;display:flex;flex-direction:column;justify-content:center;min-width:240px}
.fila .vez small{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}.fila .vez b{font-family:"Barlow Condensed",sans-serif;font-size:clamp(34px,3.4vw,52px);line-height:1}
.fila .vez span{font-size:14px}.fila .prox{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fila .it{background:var(--panel);border-radius:10px;padding:8px 14px;display:flex;gap:8px;align-items:baseline}.fila .it b{font-family:"Barlow Condensed",sans-serif;font-size:26px}.fila .it .p{color:var(--mute);font-family:"Barlow Condensed",sans-serif;font-size:22px}.fila .it span{color:var(--mute);font-size:13px}
.fila .nada{color:var(--mute);font-size:14px;align-self:center}
.sec{padding:4px max(2vw,14px) 6px;color:var(--mute);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.board{grid-template-columns:minmax(0,1fr)}.col{min-height:0}.clock{margin-inline-start:0}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .4s}}
</style></head><body>
<header>
 <div class="brand"><span class="logo" id="logo"></span><b id="nome">Painel ao vivo</b><span id="sync">Conectando…</span></div>
 <div class="ctl">
  <select id="f_loja" hidden aria-label="Loja"></select>
  <button id="b_som" type="button" aria-pressed="false">Som: desligado</button>
  <button id="b_tela" type="button">Tela cheia</button>
  <button id="b_sair" type="button">Sair</button>
 </div>
 <div class="clock num" id="clock">--:--</div>
</header>
<section class="metas" id="metasbar"></section>
<section class="fila" id="fila" aria-live="polite"></section>
<section class="kpis" id="kpis"></section>
<main class="board" id="board"></main>
<div class="sec" id="h_chk" hidden><span>Verificar · fora do kanban</span><span>Pedidos acima do limite da etapa (provável baixa esquecida na Foody)</span></div>
<section class="chk" id="chk"></section>
<section class="placar" id="placar"></section>
<div class="sec"><span>Motoboys hoje</span><span id="metas"></span></div>
<section class="riders" id="riders"></section>
<div id="festa" hidden><canvas id="confete"></canvas><div class="msg" role="alert"><b id="f_tit"></b><span id="f_sub"></span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script src="../shared/supa.js"></script>
<script>
{
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ATIVOS=['open','ready','dispatched','accepted','onGoing'];
const COLS='uid,numero,status,canal,entregador,aberto_em,despachado_em,coletado_em,entregue_em,finalizado_em,prazo_em,dia,qtd_pizzas,valor_total';
let LOJA=null,LOJAS=[],M={},canal=null,ultimoColetor=null,METAS=[],FILA=[],FILA_HOJE=0;
const PED=new Map();
const ms=v=>v?new Date(v).getTime():null;
const mm=sec=>{sec=Math.max(0,Math.round(sec/1000));const m=Math.floor(sec/60),x=sec%60;return m+':'+String(x).padStart(2,'0')};
const hh=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
const pzTxt=n=>n==null?'':(n===1?'1 pizza':n+' pizzas');
const somaPz=l=>{const v=l.map(o=>o.pz).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0):null};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const lvl=(el,m)=>el>=m?'bad':el>=m*.8?'warn':'';
function guardar(r){if(!r||!r.uid)return;PED.set(r.uid,{id:r.numero||'',uid:r.uid,st:r.status,canal:r.canal||'',mb:(r.entregador||'').trim(),
 ab:ms(r.aberto_em),de:ms(r.despachado_em),co:ms(r.coletado_em),en:ms(r.entregue_em)||(r.status==='closed'?ms(r.finalizado_em):null),due:ms(r.prazo_em),dia:r.dia,pz:r.qtd_pizzas,val:r.valor_total==null?0:+r.valor_total})}

async function carregar(){
 PED.clear();const hoje=Painel.diaOperacional();
 const rows=await Painel.tudo(()=>Painel.sb.from('pedidos').select(COLS).eq('loja_id',LOJA.id).or(`dia.eq.${hoje},status.in.(${ATIVOS.join(',')})`).order('uid'));
 rows.forEach(guardar);
 const {data:e}=await Painel.sb.from('coletor_estado').select('ultimo_sucesso,ultimo_erro').eq('loja_id',LOJA.id).maybeSingle();
 ultimoColetor=e;
 const {data:mt}=await Painel.sb.from('metas_semana').select('dia_semana,meta_vendas,meta_viagens').eq('loja_id',LOJA.id);METAS=mt||[];
 await carregarFila();
}
// fila da vez: check-in dos motoboys no tablet da loja (página /checkin/)
async function carregarFila(){
 const {data}=await Painel.sb.from('fila_checkin').select('id,entregador,chegou_em,saiu_em').eq('loja_id',LOJA.id).eq('dia',Painel.diaOperacional()).order('chegou_em').order('id');
 FILA_HOJE=(data||[]).length;FILA=(data||[]).filter(f=>!f.saiu_em);
}
function assinar(){
 if(canal)Painel.sb.removeChannel(canal);
 canal=Painel.sb.channel('ped-'+LOJA.id).on('postgres_changes',{event:'*',schema:'public',table:'pedidos',filter:`loja_id=eq.${LOJA.id}`},p=>guardar(p.new))
  .on('postgres_changes',{event:'*',schema:'public',table:'fila_checkin',filter:`loja_id=eq.${LOJA.id}`},()=>carregarFila().catch(()=>{})).subscribe();
}
// viagens do dia: pedidos do mesmo motoboy coletados antes da 1ª entrega da viagem atual
function viagens(lista){
 const por={};lista.filter(o=>o.mb&&o.co).sort((a,b)=>a.co-b.co).forEach(o=>(por[o.mb]||(por[o.mb]=[])).push(o));
 const out={};
 for(const [mb,ps] of Object.entries(por)){const vs=[];let at=[];
  for(const o of ps){if(at.length){const ents=at.filter(x=>x.en&&x.en-x.co>=120000).map(x=>x.en);const pri=ents.length?Math.min(...ents):null;
    if(pri!==null&&o.co>pri-120000){vs.push(at);at=[]}}at.push(o)}
  if(at.length)vs.push(at);
  out[mb]=vs.map(v=>({sa:Math.max(...v.map(x=>x.co)),fim:v.every(x=>x.en)?Math.max(...v.map(x=>x.en)):null,ps:v}))}
 return out}

// ---------- gamificação: som e comemoração ----------
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
let AC=null,somOn=false;
try{somOn=localStorage.getItem('foody_som')==='1'}catch(_){}
function ctx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume();return AC}
function nota(f,t0,d,tipo='triangle',vol=.25){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=tipo;o.frequency.value=f;
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+d+.05)}
function fanfarra(){const a=ctx();if(!a||!somOn)return;const t=a.currentTime+.05;
 [523.25,659.25,783.99,1046.5].forEach((f,i)=>nota(f,t+i*.14,.25));
 [523.25,659.25,783.99,1046.5].forEach(f=>nota(f,t+.62,1.6,'sawtooth',.07));[1046.5,1318.5].forEach(f=>nota(f,t+.62,1.6,'triangle',.18));
 for(let i=0;i<10;i++){const tt=t+.7+Math.random()*1.6,buf=a.createBuffer(1,a.sampleRate*.06,a.sampleRate),d=buf.getChannelData(0);
  for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,3);const s=a.createBufferSource(),g=a.createGain();g.gain.value=.25;s.buffer=buf;s.connect(g).connect(a.destination);s.start(tt)}}
function confete(ms){const cv=$('confete'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
 const cores=['#e8442e','#f2a516','#2fbf71','#4ea1ff','#f3eee4','#c86bfa'];
 const P=Array.from({length:220},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.3,vr:(Math.random()-.5)*.3,w:6+Math.random()*8,h:4+Math.random()*6,c:cores[Math.random()*cores.length|0]}));
 const fim=performance.now()+ms;(function q(t){c.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;
  if(p.y>cv.height+20&&t<fim-1500){p.y=-20;p.vy=2+Math.random()*3}c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.w/2,-p.h/2,p.w,p.h);c.restore()});
  if(t<fim)requestAnimationFrame(q);else c.clearRect(0,0,cv.width,cv.height)})(performance.now())}
let festaAte=0;
function festa(tit,sub){$('f_tit').textContent=tit;$('f_sub').textContent=sub;$('festa').hidden=false;festaAte=Date.now()+9000;
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches)confete(8000);fanfarra();
 setTimeout(()=>{if(Date.now()>=festaAte)$('festa').hidden=true},9000)}
function checarMeta(tipo,atual,meta,tit,sub){if(!meta||atual<meta)return;const k=`foody_festa_${LOJA.id}_${Painel.diaOperacional()}_${tipo}`;
 let ja=false;try{ja=localStorage.getItem(k)==='1';localStorage.setItem(k,'1')}catch(_){ja=!!window['__'+k];window['__'+k]=1}
 if(!ja)festa(tit,sub)}

function card(o,stage,now){
 let el,lim,label,extra='';
 if(stage==='coz'){el=now-o.ab;lim=M.desp;label='na cozinha'}
 else if(stage==='esp'){el=now-o.de;lim=M.esp;label='aguardando saída';extra=o.mb?`<span>${esc(o.mb)}</span>`:''}
 else{el=now-o.co;lim=M.tr;label='em trânsito';extra=`<span>${esc(o.mb)}</span>`+(o.nv>1?`<span class="tag">viagem ${o.pos}/${o.nv}</span>`:'')}
 const late=o.due&&now>o.due,pct=o.due?Math.min(100,(now-o.ab)/(o.due-o.ab)*100):0;
 return `<article class="card ${lvl(el,lim)} ${late?'late':''}"><div class="top"><span class="id num">#${esc(o.id)}</span><span class="t num">${mm(el)}</span></div>
 <div class="meta"><span class="tag">${esc(o.canal)}</span>${o.pz?`<span class="tag">${pzTxt(o.pz)}</span>`:''}${extra}<span>${label}</span><span>total ${mm(now-o.ab)}</span>${late?`<span class="tag late">ATRASADO +${mm(now-o.due)}</span>`:(o.due?`<span>prazo ${hh(o.due)}</span>`:'')}</div>
 <div class="bar"><i style="width:${pct.toFixed(0)}%"></i></div></article>`}
// cartão agrupado: uma viagem (em rota) ou uma saída em preparação (aguardando, por motoboy)
function grupo(g,stage,now){
 const ps=g.ps,rest=ps.filter(o=>!o.en),base=stage==='rota'?g.sa:Math.min(...ps.map(o=>o.de));
 const el=now-base,lim=stage==='rota'?M.tr:M.esp;
 const lates=rest.filter(o=>o.due&&now>o.due),late=lates.length>0,atr=late?Math.max(...lates.map(o=>now-o.due)):0;
 const pct=Math.max(0,...rest.filter(o=>o.due).map(o=>Math.min(100,(now-o.ab)/(o.due-o.ab)*100)));
 const pz=somaPz(ps),ids=ps.map(o=>`<span${o.en?' style="text-decoration:line-through;opacity:.5"':''}>#${esc(o.id)}</span>`).join(' · ');
 const label=stage==='rota'?'em trânsito':'aguardando saída';
 return `<article class="card ${lvl(el,lim)} ${late?'late':''}"><div class="top"><span class="id num">${ids}</span><span class="t num">${mm(el)}</span></div>
 <div class="meta"><span><b>${esc(g.mb||'sem motoboy')}</b></span><span class="tag">${ps.length} ${ps.length>1?'entregas':'entrega'}</span>${pz?`<span class="tag">${pzTxt(pz)}</span>`:''}${stage==='rota'&&rest.length<ps.length?`<span class="tag">faltam ${rest.length}</span>`:''}<span>${label}</span>${late?`<span class="tag late">ATRASADO +${mm(atr)}</span>`:''}</div>
 <div class="bar"><i style="width:${pct.toFixed(0)}%"></i></div></article>`}
// card do motoboy na 4ª coluna: voltando para a loja ou já na loja (check-in)
function cardMb(m,now){
 const cls=m.pos===1?'vez':m.pos?'ok':m.pausa?'pausa':'';
 const tempo=m.pos?now-m.chegou:now-m.last;
 const st=m.pos?`<span class="tag ${m.pos===1?'late':'ok'}">${m.pos===1?'da vez':m.pos+'º da fila'}</span><span>na loja há ${mm(now-m.chegou)}</span>`
  :m.pausa?`<span>sem viagem há ${mm(now-m.last)} · pausa?</span>`:`<span>voltando · entregou ${hh(m.last)}</span>`;
 const sai=m.sai.length?`<span class="tag">saindo: ${m.sai.length} ${m.sai.length>1?'pedidos':'pedido'}</span>`:'';
 return `<article class="card mbc ${cls}"><div class="top"><span class="id nm">${esc(m.mb)}</span><span class="t num">${mm(tempo)}</span></div>
 <div class="meta">${st}${sai}<span>${m.n} ${m.n===1?'entrega':'entregas'} hoje</span></div></article>`}

function renderFila(){
 const el=$('fila'),now=Date.now(),k=s=>String(s||'').trim().toLowerCase();
 if(!FILA.length){el.innerHTML=`<div class="nada">${FILA_HOJE?'Fila da vez vazia: nenhum motoboy na loja.':'Fila da vez: nenhum check-in hoje (tablet da porta em /checkin).'}</div>`;return}
 // pedidos já despachados para o motoboy e ainda não coletados
 const carga=n=>[...PED.values()].filter(o=>o.de&&!o.co&&!o.en&&k(o.mb)===k(n)).length;
 const t=f=>Math.max(0,Math.floor((now-new Date(f.chegou_em).getTime())/60000));
 const v=FILA[0],c=carga(v.entregador);
 el.innerHTML=`<div class="vez"><small>Motoboy da vez</small><b>${esc(v.entregador)}</b><span>na loja há ${t(v)} min${c?` · já com ${c} ${c>1?'pedidos':'pedido'}`:''}</span></div>
  <div class="prox">${FILA.slice(1,8).map((f,i)=>`<div class="it"><span class="p">${i+2}º</span><b>${esc(f.entregador)}</b><span>${t(f)} min</span></div>`).join('')}${FILA.length>8?`<div class="it"><span>+${FILA.length-8}</span></div>`:''}</div>`;
}
function render(){
 renderFila();
 if(!LOJA)return;const now=Date.now();$('clock').textContent=hh(now);
 const hoje=Painel.diaOperacional();
 const todos=[...PED.values()].filter(o=>!['cancelled','rejected'].includes(o.st)&&o.ab);
 // só o dia operacional; pedidos abertos de dias anteriores ficam fora
 const dia0=todos.filter(o=>o.dia===hoje);
 // desvios: etapa acima do limite (provável baixa esquecida)
 const desvio=o=>{if(o.en)return null;if(o.co)return now-o.co>M.lr?['sem baixa',now-o.co]:null;if(o.de)return now-o.de>M.le?['aguardando',now-o.de]:null;return now-o.ab>M.lc?['na cozinha',now-o.ab]:null};
 const chk=dia0.map(o=>[o,desvio(o)]).filter(x=>x[1]);
 const fora=new Set(chk.map(x=>x[0].uid));
 const dia=dia0.filter(o=>!fora.has(o.uid));
 const vg=viagens(dia);
 Object.values(vg).flat().forEach(v=>{const ord=[...v.ps].sort((a,b)=>(a.en||9e15)-(b.en||9e15));ord.forEach((o,i)=>{o.nv=v.ps.length;o.pos=i+1})});
 const coz=dia.filter(o=>!o.de&&!o.en).sort((a,b)=>a.ab-b.ab),
  esp=dia.filter(o=>o.de&&!o.co&&!o.en).sort((a,b)=>a.de-b.de),
  rota=dia.filter(o=>o.co&&!o.en).sort((a,b)=>a.co-b.co),
  ent=dia.filter(o=>o.en);
 const gRota=Object.entries(vg).flatMap(([mb,vs])=>vs.filter(v=>v.ps.some(o=>!o.en)).map(v=>({mb,sa:v.sa,ps:[...v.ps].sort((a,b)=>(a.en||9e15)-(b.en||9e15))}))).sort((a,b)=>a.sa-b.sa);
 const porMb={};esp.forEach(o=>{const k=o.mb||('_'+o.uid);(porMb[k]||(porMb[k]={mb:o.mb,ps:[]})).ps.push(o)});
 const gEsp=Object.values(porMb).sort((a,b)=>Math.min(...a.ps.map(o=>o.de))-Math.min(...b.ps.map(o=>o.de)));
 $('h_chk').hidden=!chk.length;
 $('chk').innerHTML=chk.map(([o,[m,t]])=>`<div class="it"><b>#${esc(o.id)}</b>${esc(m)} há ${mm(t)} <span>${esc(o.mb||'')}</span></div>`).join('');
 const pend={};chk.forEach(([o])=>{if(o.mb)(pend[o.mb]||(pend[o.mb]=[])).push('#'+o.id)});
 const ativos=[...coz,...esp,...rota],atras=ativos.filter(o=>o.due&&now>o.due).length;
 const despV=dia.filter(o=>o.de).map(o=>o.de-o.ab).filter(x=>x>=120000&&x<=3600000);
 const trV=ent.filter(o=>o.co).map(o=>o.en-o.co).filter(x=>x>=120000&&x<=3600000);
 const comPrazo=ent.filter(o=>o.due),noPrazo=comPrazo.filter(o=>o.en<=o.due).length,naMeta=ent.filter(o=>o.en-o.ab<=M.tot).length;
 const K=[['Em andamento',ativos.length,''],['Atrasados agora',atras,atras?'bad':'ok'],
  ['Até despacho médio',despV.length?mm(avg(despV)):'–',avg(despV)>M.desp?'warn':''],
  ['Coleta → entrega média',trV.length?mm(avg(trV)):'–',avg(trV)>M.tr?'warn':''],
  ['Entregues hoje',ent.length,''],['No prazo',comPrazo.length?Math.round(noPrazo/comPrazo.length*100)+'%':'–',comPrazo.length&&noPrazo/comPrazo.length<.85?'warn':'ok'],
  [`Dentro da meta ${M.tot/60000} min`,ent.length?Math.round(naMeta/ent.length*100)+'%':'–','']];
 $('kpis').innerHTML=K.map(([l,v,c])=>`<div class="kpi ${c}"><small>${l}</small><div class="num">${v}</div></div>`).join('');
 const col=(t,list,html,nPed)=>`<section class="col"><h2>${t}<span class="num">${list.length}${nPed!=null&&nPed!==list.length?`<small style="font-size:15px;font-weight:500;color:var(--mute)"> · ${nPed} ped.</small>`:''}</span></h2>${list.length?list.map(html).join(''):'<div class="empty">Nenhum pedido</div>'}</section>`;
 // 4ª coluna: motoboys que não estão em rota — na loja (check-in, na ordem da fila) e voltando (pela hora da última entrega)
 const k=x=>String(x||'').trim().toLowerCase(),posFila=new Map(FILA.map((f,i)=>[k(f.entregador),[i+1,ms(f.chegou_em)]]));
 const livres=Object.entries(vg).filter(([,vs])=>vs.length&&vs.every(v=>v.fim)).map(([mb,vs])=>{
  const last=Math.max(...vs.map(v=>v.fim)),f=posFila.get(k(mb))||[];
  return {mb,last,pos:f[0]||0,chegou:f[1]||null,pausa:!f[0]&&now-last>3600000,n:vs.flatMap(v=>v.ps).filter(o=>o.en).length,sai:esp.filter(o=>k(o.mb)===k(mb))}});
 FILA.forEach((f,i)=>{if(!livres.some(m=>k(m.mb)===k(f.entregador))&&!Object.entries(vg).some(([mb,vs])=>k(mb)===k(f.entregador)&&vs.some(v=>!v.fim)))
  livres.push({mb:f.entregador,last:ms(f.chegou_em),pos:i+1,chegou:ms(f.chegou_em),pausa:false,n:0,sai:esp.filter(o=>k(o.mb)===k(f.entregador))})});
 livres.sort((a,b)=>(a.pos||99)-(b.pos||99)||(a.pausa-b.pausa)||a.last-b.last);
 const colMb=`<section class="col"><h2>Retorno / na loja<span class="num">${livres.filter(m=>!m.pausa).length}</span></h2>${livres.length?livres.map(m=>cardMb(m,now)).join(''):'<div class="empty">Nenhum motoboy voltando</div>'}</section>`;
 $('board').innerHTML=col('Na cozinha',coz,o=>card(o,'coz',now))+col('Aguardando saída',gEsp,g=>grupo(g,'esp',now),esp.length)+col('Em rota',gRota,g=>grupo(g,'rota',now),rota.length)+colMb;
 const nomes=[...new Set([...Object.keys(vg),...esp.map(o=>o.mb).filter(Boolean)])];
 $('riders').innerHTML=nomes.map(mb=>{const vs=vg[mb]||[];
  const em=vs.find(v=>!v.fim);let ativo=0,last=null;
  // hora trabalhada: 1ª coleta do dia até a última entrega; a viagem final conta no máximo o teto configurado
  vs.forEach(v=>{if(v.fim)last=v.fim});
  if(vs.length){const ini=Math.min(...vs.flatMap(v=>v.ps.map(o=>o.co))),ult=vs[vs.length-1];
   const fim=em?Math.min(now,em.sa+M.teto):Math.min(ult.fim||now,ult.sa+M.teto);ativo=Math.max(0,fim-ini)}
  let st,cls,el;
  if(em){st='Em rota';cls='rota';el=now-em.sa}else if(last!==null){el=now-last;if(el>3600000){st='Pausa / fora';cls='pausa'}else{st='Retorno / na loja';cls='loja'}}else{st='Aguardando 1ª saída';cls='loja';el=0}
  const n=vs.flatMap(v=>v.ps).filter(o=>o.en).length;
  let carga='';
  if(em){const rest=em.ps.filter(o=>!o.en);carga=`<div class="ld">Viagem: <b>${em.ps.length}</b> ${em.ps.length>1?'entregas':'entrega'}${somaPz(em.ps)!=null?` · <b>${somaPz(em.ps)}</b> ${somaPz(em.ps)===1?'pizza':'pizzas'}`:''}${rest.length<em.ps.length?` · faltam ${rest.length}`:''}</div>`}
  const sai=esp.filter(o=>o.mb===mb);
  if(sai.length)carga+=`<div class="ld sai">Saindo: <b>${sai.length}</b> ${sai.length>1?'entregas':'entrega'}${somaPz(sai)!=null?` · <b>${somaPz(sai)}</b> ${somaPz(sai)===1?'pizza':'pizzas'}`:''}</div>`;
  return `<div class="rider ${cls}"><b>${esc(mb)}</b><div class="st"><span>${st}</span><span class="num">${mm(el)}</span></div>${carga}
  <div class="sm"><span>${n} entregas</span><span>${(ativo/3600000).toFixed(1)} h trabalhadas</span><span>${ativo>0?(n/(ativo/3600000)).toFixed(1):'–'}/h</span>${pend[mb]?`<span style="color:var(--warn)">verificar ${esc(pend[mb].join(' '))}</span>`:''}</div></div>`}).join('')||'<div class="empty">Nenhum motoboy saiu hoje</div>';
 // placar: ativo = fez a 1ª coleta do dia; em entrega = tem viagem aberta; aguardo/retorno = os demais ativos
 const ativosMb=new Set(dia0.filter(o=>o.co&&o.mb).map(o=>o.mb));
 const emEntrega=new Set(Object.entries(vg).filter(([,vs])=>vs.some(v=>!v.fim)).map(([mb])=>mb));
 const nAt=ativosMb.size,nEnt=[...emEntrega].filter(m=>ativosMb.has(m)).length;
 const todasVg=Object.values(vg).flat(),vFeitas=todasVg.filter(v=>v.fim).length,vAnd=todasVg.length-vFeitas;
 $('placar').innerHTML=`<div><span>Entregadores ativos hoje</span><b>${nAt}</b></div><div class="rota"><span>Em entrega</span><b>${nEnt}</b></div><div class="loja"><span>Aguardo / retorno à base</span><b>${nAt-nEnt}</b></div><div class="via"><span>Viagens hoje<small>${vAnd?`+${vAnd} em andamento`:'concluídas'}</small></span><b>${vFeitas}</b></div>`;
 // metas do dia
 const dsem=new Date(hoje+'T12:00:00').getDay(),mHoje=METAS.find(m=>m.dia_semana===dsem)||{};
 const vendas=dia0.reduce((a,o)=>a+(o.val||0),0),mv=+mHoje.meta_vendas||0,mt=+mHoje.meta_viagens||0;
 const barra=(rot,txt,at,me)=>{const pc=Math.min(100,at/me*100);return `<div class="alvo ${at>=me?'ok':''}"><div class="l"><span>${rot}</span><span><b>${txt}</b> ${at>=me?'· meta batida!':'· '+Math.round(pc)+'%'}</span></div><div class="tr"><i style="width:${pc.toFixed(1)}%"></i></div></div>`};
 $('metasbar').innerHTML=(mv?barra('Vendas do dia',`${brl(vendas)} / ${brl(mv)}`,vendas,mv):'')+(mt?barra('Viagens do dia',`${vFeitas} / ${mt}`,vFeitas,mt):'');
 $('metasbar').hidden=!(mv||mt);
 checarMeta('vendas',vendas,mv,'META DE VENDAS BATIDA!',`${brl(vendas)} vendidos hoje`);
 checarMeta('viagens',vFeitas,mt,'META DE VIAGENS BATIDA!',`${vFeitas} viagens concluídas hoje`);
 const ok=ultimoColetor&&ultimoColetor.ultimo_sucesso,idade=ok?now-ms(ultimoColetor.ultimo_sucesso):null;
 const s=$('sync');if(!ok){s.textContent='Coletor sem dados';s.className='off'}
 else if(idade>120000){s.textContent=`Sem atualização da Foody há ${Math.round(idade/60000)} min`;s.className='off'}
 else{s.textContent=`Ao vivo · Foody atualizado às ${new Date(ms(ultimoColetor.ultimo_sucesso)).toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo'})}`;s.className=''}
}
async function iniciarLoja(){
 M={desp:LOJA.meta_despacho_min*60000,esp:LOJA.meta_espera_min*60000,tr:LOJA.meta_transito_min*60000,tot:LOJA.meta_total_min*60000,teto:(LOJA.teto_viagem_min||60)*60000,
  lc:(LOJA.limite_cozinha_min||90)*60000,le:(LOJA.limite_espera_min||60)*60000,lr:(LOJA.limite_rota_min||60)*60000};
 $('nome').textContent=LOJA.nome+' · ao vivo';
 $('metas').textContent=`Metas: despacho ${LOJA.meta_despacho_min} min · espera ${LOJA.meta_espera_min} min · trânsito ${LOJA.meta_transito_min} min · total ${LOJA.meta_total_min} min`;
 await carregar();assinar();render();
}
$('logo').innerHTML=Painel.SIMBOLO;
$('b_sair').onclick=()=>Painel.sair();
const somBtn=()=>{$('b_som').textContent='Som: '+(somOn?'ligado':'desligado');$('b_som').setAttribute('aria-pressed',somOn)};somBtn();
$('b_som').onclick=()=>{somOn=!somOn;try{localStorage.setItem('foody_som',somOn?'1':'0')}catch(_){}somBtn();if(somOn){ctx();const a=AC;if(a){nota(784,a.currentTime+.02,.18);nota(1046.5,a.currentTime+.16,.3)}}};
// navegadores só liberam áudio após um toque/clique na página: o primeiro clique em qualquer lugar destrava
document.addEventListener('click',()=>{if(somOn)ctx()},{once:true});
$('festa').onclick=()=>{$('festa').hidden=true};
window.testarFesta=()=>festa('META DE VENDAS BATIDA!','Teste da comemoração');
$('b_tela').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}};
$('f_loja').onchange=()=>{LOJA=LOJAS.find(l=>l.id===$('f_loja').value);Painel.guardarLoja(LOJA.id);iniciarLoja()};
Painel.exigirLogin('Painel ao vivo').then(async()=>{
 LOJAS=await Painel.lojas();
 if(!LOJAS.length){$('sync').textContent='Seu usuário ainda não tem acesso a nenhuma loja';$('sync').className='off';return}
 LOJA=Painel.lojaPreferida(LOJAS);
 $('f_loja').innerHTML=LOJAS.map(l=>`<option value="${esc(l.id)}">${esc(l.nome)}</option>`).join('');$('f_loja').value=LOJA.id;$('f_loja').hidden=LOJAS.length<2;
 await iniciarLoja();
 if(location.hash==='#teste-festa')setTimeout(()=>festa('META DE VENDAS BATIDA!','Teste da comemoração'),800);
 setInterval(render,1000);
 setInterval(()=>carregar().catch(()=>{}),60000); // rede de segurança caso o tempo real caia
}).catch(e=>{$('sync').textContent='Erro: '+(e.message||e);$('sync').className='off'});
}
