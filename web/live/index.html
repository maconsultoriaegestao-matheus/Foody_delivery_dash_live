<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel ao vivo cozinha</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: painel operacional de cozinha, lido a 4 metros, sem enfeite
   IDEA: trilho de comandas (KDS) — cada pedido é uma comanda que anda da cozinha até o cliente
   PICTURE: o próprio quadro kanban com cronômetros vivos
   COLOUR+TYPE: grafite (TV) + comanda papel; verde/âmbar/vermelho só para estado; Barlow Condensed nos números
   LAYOUT: barra de indicadores, 4 colunas de etapa, faixa de motoboys embaixo */
:root{color-scheme:dark;--bg:#141619;--panel:#1d2024;--line:#2c3036;--ink:#eef0f2;--mute:#9aa1a9;--paper:#f3eee4;--pink:#1a1a1a;

*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Barlow,system-ui,sans-serif;overflow-x:clip}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:14px max(2vw,14px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column}.brand b{font-size:20px}.brand span{color:var(--mute);font-size:13px}
.clock{font-size:clamp(40px,4vw,64px);line-height:1;margin-inline-start:auto}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 12px;cursor:pointer}
button[aria-pressed=true]{background:var(--ink);color:var(--bg)}button:focus-visible,input:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
input[type=range]{padding:0;width:min(260px,40vw);accent-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-bottom:1px solid var(--line)}
.kpi{padding:12px 16px;box-shadow:inset -1px 0 var(--line),inset 0 -1px var(--line)}.kpi small{display:block;color:var(--mute);font-size:13px}.kpi .num{font-size:clamp(30px,3vw,46px);line-height:1.05}
.kpi.bad .num{color:var(--bad)}.kpi.ok .num{color:var(--ok)}.kpi.warn .num{color:var(--warn)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px max(2vw,14px)}
.col{background:var(--panel);border-radius:12px;padding:10px;min-height:52vh;display:flex;flex-direction:column;gap:8px}
.col h2{margin:2px 4px 6px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.col h2 .num{font-size:28px}
.card{background:var(--paper);color:var(--pink);border-radius:8px;padding:8px 10px 10px;border-inline-start:8px solid var(--ok);position:relative}
.card.warn{border-color:var(--warn)}.card.bad{border-color:var(--bad)}
.card.late{box-shadow:0 0 0 3px var(--bad)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.card .id{font-size:30px;line-height:1}.card .t{font-size:34px;line-height:1}
.card.warn .t{color:#a86a00}.card.bad .t{color:#c62828}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:#4a4a4a;margin-top:4px}
.tag{font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px;background:#e2dccf}
.tag.late{background:var(--bad);color:#fff}.tag.sus{background:#4a4a4a;color:#fff}.tag.ok{background:#cdeedb;color:#11643a}
.bar{height:6px;background:#ddd5c6;border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.card.warn .bar i{background:var(--warn)}.card.bad .bar i,.card.late .bar i{background:var(--bad)}
.empty{color:var(--mute);text-align:center;padding:20px 0;font-size:14px}
.riders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:0 max(2vw,14px) 14px}
.rider{background:var(--panel);border-radius:10px;padding:10px 12px;border-top:4px solid var(--mute)}
.rider.rota{border-color:var(--ok)}.rider.loja{border-color:var(--warn)}.rider.pausa{border-color:var(--line)}
.rider b{font-size:17px}.rider .st{display:flex;justify-content:space-between;align-items:baseline}.rider .st .num{font-size:30px}
.rider .sm{color:var(--mute);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.sec{padding:4px max(2vw,14px) 6px;color:var(--mute);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
details{margin:0 max(2vw,14px) 18px;background:var(--panel);border-radius:10px;padding:10px 14px}
details summary{cursor:pointer;font-weight:600}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.cfg label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}.cfg input{width:100%;cursor:text;font-size:16px}
@media(max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.board{grid-template-columns:minmax(0,1fr)}.col{min-height:0}.clock{margin-inline-start:0}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .4s}}
</style></head><body>
<header>
 <div class="brand"><b>Pitizza Água Verde · ao vivo</b><span>Simulação do expediente de 25/11 com pedidos reais, sem dados de clientes</span></div>

  <button id="play" aria-pressed="true">Pausar</button>

  <input id="seek" type="range" min="0" max="1" step="30" aria-label="Horário da simulação">
 </div>
 <div class="clock num" id="clock">--:--</div>
</header>
<section class="kpis" id="kpis"></section>
<main class="board" id="board"></main>
<div class="sec"><span>Motoboys</span><span>Horas ativas = tempo em rota + intervalos de até 60 min entre viagens</span></div>
<section class="riders" id="riders"></section>
<details><summary>Metas e alertas</summary>
 <div class="cfg">
  <label>Meta até despacho (min)<input id="m_desp" type="number" min="1" value="15"></label>
  <label>Meta espera p/ saída (min)<input id="m_esp" type="number" min="1" value="5"></label>
  <label>Meta trânsito (min)<input id="m_tr" type="number" min="1" value="20"></label>
  <label>Meta tempo total (min)<input id="m_tot" type="number" min="1" value="30"></label>
  <label>Alerta âmbar a partir de (% da meta)<input id="m_alert" type="number" min="10" max="100" value="80"></label>
 </div>
</details>

"22:27:10","22:46:14","22:48:22","23:07:19","23:07:10","iFood",70.75,37,1,""],[46,"Duarte","22:58:59","23:13:19","23:13:44","23:38:55","23:38:59","iFood",76.13,38,1,""],[47,"Alysson","23:00:07","23:15:25","23:25:47","23:29:32","23:40:07","iFood",117.86,39,1,""],[48,"Alysson","23:23:21","23:41:42","23:55:08","23:56:45","24:03:21","iFood",73.75,40,1,"imediata"]];
const s=t=>{const[h,m,x]=t.split(':').map(Number);return h*3600+m*60+x};
const O=RAW.map(r=>({id:r[0],mb:r[1],ab:s(r[2]),de:s(r[3]),co:s(r[4]),en:s(r[5]),due:s(r[6]),canal:r[7],val:r[8],vg:r[9],nv:r[10],sus:r[11]}));
const T0=Math.min(...O.map(o=>o.ab))-10*60, T1=Math.max(...O.map(o=>o.en))+15*60;
const trips={};O.forEach(o=>{const k=o.mb+'|'+o.vg;(trips[k]||(trips[k]={mb:o.mb,sa:0,fim:0,ids:[]}));trips[k].sa=Math.max(trips[k].sa,o.co);trips[k].fim=Math.max(trips[k].fim,o.en);trips[k].ids.push(o)});
O.forEach(o=>{const tr=trips[o.mb+'|'+o.vg];o.pos=[...tr.ids].sort((a,b)=>a.en-b.en).indexOf(o)+1;o.sa=tr.sa});
const $=id=>document.getElementById(id), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let now=s('19:30:00'),speed=10,playing=true;
const seek=$('seek');seek.min=T0;seek.max=T1;seek.value=now;
const mm=sec=>{sec=Math.max(0,Math.round(sec));const m=Math.floor(sec/60),x=sec%60;return m+':'+String(x).padStart(2,'0')};
const hh=sec=>{sec=((sec%86400)+86400)%86400;return String(Math.floor(sec/3600)).padStart(2,'0')+':'+String(Math.floor(sec%3600/60)).padStart(2,'0')};
const meta=()=>({desp:+$('m_desp').value*60,esp:+$('m_esp').value*60,tr:+$('m_tr').value*60,tot:+$('m_tot').value*60,al:+$('m_alert').value/100});
const lvl=(el,m,a)=>el>=m?'bad':el>=m*a?'warn':'';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function card(o,stage,M){
 let el,lim,label,extra='';
 if(stage==='coz'){el=now-o.ab;lim=M.desp;label='na cozinha'}
 else if(stage==='esp'){el=now-o.de;lim=M.esp;label='aguardando saída';extra=`<span>${esc(o.mb)}</span>`}
 else if(stage==='rota'){el=now-o.co;lim=M.tr;label='em trânsito';extra=`<span>${esc(o.mb)}</span>`+(o.nv>1?`<span class="tag">viagem ${o.pos}/${o.nv}</span>`:'')}

 return `<article class="card ${cls} ${late?'late':''}"><div class="top"><span class="id num">#${o.id}</span><span class="t num">${mm(el)}</span></div>
 <div class="meta"><span class="tag">${esc(o.canal)}</span>${extra}<span>${label}</span><span>total ${mm(now-o.ab)}</span>${late?`<span class="tag late">ATRASADO +${mm(now-o.due)}</span>`:`<span>prazo ${hh(o.due)}</span>`}</div>

 <div class="meta"><span>${esc(o.mb)}</span><span>entregue ${hh(o.en)}</span>${late?`<span class="tag late">+${mm(o.en-o.due)} atraso</span>`:`<span class="tag ok">no prazo</span>`}${o.sus?`<span class="tag sus">baixa ${esc(o.sus)}</span>`:''}</div></article>`}
function render(){
 const M=meta();$('clock').textContent=hh(now);seek.value=now;
 const vis=O.filter(o=>o.ab<=now);
 const coz=vis.filter(o=>now<o.de).sort((a,b)=>a.ab-b.ab), esp=vis.filter(o=>o.de<=now&&now<o.co).sort((a,b)=>a.de-b.de),
  rota=vis.filter(o=>o.co<=now&&now<o.en).sort((a,b)=>a.co-b.co), ent=vis.filter(o=>o.en<=now), rec=ent.filter(o=>now-o.en<30*60).sort((a,b)=>b.en-a.en);

  ['Entregues hoje',ent.length,''],['No prazo',ent.length?Math.round(noPrazo/ent.length*100)+'%':'–',noPrazo/ent.length<.85?'warn':'ok'],

 $('riders').innerHTML=mbs.map(mb=>{
  const tr=Object.values(trips).filter(t=>t.mb===mb&&t.sa<=now).sort((a,b)=>a.sa-b.sa);
  const em=tr.find(t=>now<t.fim);
  let ativo=0,last=null;tr.forEach(t=>{if(last!==null){const g=t.sa-last;if(g>0&&g<=3600)ativo+=g}ativo+=Math.min(now,t.fim)-t.sa;last=t.fim});

  if(em){st='Em rota';cls='rota';el=now-em.sa}else if(last!==null){el=now-last;if(el>3600){st='Pausa / fora';cls='pausa'}else{st='Retorno / na loja';cls='loja';ativo+=el}}else{st='Aguardando 1ª saída';cls='pausa';el=0}

  return `<div class="rider ${cls}"><b>${esc(mb)}</b><div class="st"><span>${st}</span><span class="num">${mm(el)}</span></div>

}
let lastT=performance.now();
function loop(t){const dt=(t-lastT)/1000;lastT=t;if(playing){now=Math.min(T1,now+dt*speed)}render();setTimeout(()=>requestAnimationFrame(loop),250)}

document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{speed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(x=>x.setAttribute('aria-pressed',x===b))});

}
